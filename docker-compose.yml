services:

    web:
      image: nginx:latest
      container_name: web_server
      restart: always
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./nginx/ssl:/etc/nginx/ssl
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        - ./site:/usr/share/nginx/html
      depends_on:
        php:
          condition: service_healthy
      networks:
        - frontend
        - backend

    php:
      build: ./php
      container_name: php_server
      restart: always
      volumes:
        - ./site:/var/www/html
      networks:
        - backend
      depends_on:
        db:
          condition: service_healthy

      healthcheck:
        test: ["CMD", "php-fpm", "-t"]
        interval: 10s
        timeout: 5s
        retries: 3

    db:
      image: mysql:8.4
      container_name: db_server
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      volumes:
        - db_data:/var/lib/mysql
      networks:
        - backend
      restart: unless-stopped

      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 20s


    portainer:
      image: portainer/portainer-ce
      container_name: portainer
      ports:
       - "127.0.0.1:9443:9443"
      volumes:
       - /var/run/docker.sock:/var/run/docker.sock
       - portainer_data:/data
      networks:
       - management
      restart: always

    backup:
      image: mysql:8.4
      container_name: backup_db
      restart: unless-stopped

      depends_on:
        db:
          condition: service_healthy

      environment:
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        BACKUP_RETENTION_DAYS: "7"

      volumes:
        - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
        - ./backup/mysql:/backup/mysql

      entrypoint: ["/bin/bash", "/usr/local/bin/backup.sh"]

      networks:
        - backend


    ftp:
      image: fauria/vsftpd
      container_name: ftp_server
      restart: unless-stopped
      ports:
        - "21:21"
        - "30000-30009:30000-30009"
      environment:
        FTP_USER: ${FTP_USER}
        FTP_PASS: ${FTP_PASS}
        PASV_ENABLE: "YES"
        PASV_MIN_PORT: 30000
        PASV_MAX_PORT: 30009
        PASV_ADDRESS: ${SERVER_IP}
      volumes:
        - ./site:/home/vsftpd
      networks:
        - frontend

    vaultwarden:
      image: vaultwarden/server:latest
      container_name: vaultwarden
      restart: unless-stopped
      volumes:
        - ./vw-data:/data
      environment:
        DOMAIN: ${VAULTWARDEN_DOMAIN}
      networks:
        - frontend

    grafana:
     image: grafana/grafana
     container_name: grafana
     ports:
      - "127.0.0.1:3000:3000"
     restart: unless-stopped
     environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
     volumes:
      - grafana-data:/var/lib/grafana
      - grafana-conf:/etc/grafana
     networks:
      - monitoring

    prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      restart: unless-stopped

      volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus-data:/prometheus
      command:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
      user: root
      networks:
       - monitoring

    node-exporter:
      image: prom/node-exporter:latest
      container_name: node-exporter
      restart: unless-stopped
      volumes:
        - /proc:/host/proc:ro
        - /sys:/host/sys:ro
        - /:/rootfs:ro
      command:
        - '--path.procfs=/host/proc'
        - '--path.rootfs=/rootfs'
        - '--path.sysfs=/host/sys'
        - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      expose:
        - 9100
      networks:
        - monitoring

volumes:
  db_data:
  portainer_data:
  grafana-data:
  grafana-conf:
  prometheus-data:

networks:
 frontend:
  driver: bridge

 backend:
  driver: bridge
  internal: true

 monitoring:
  driver: bridge

 management:
  driver: bridge
